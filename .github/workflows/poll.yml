name: Poll Telegram channels

on:
  schedule:
    # Once daily at 9:00 AM Saudi time (06:00 UTC). Poll mode only processes posts newer than each channel's
    # cursor, so routine runs stay bounded to newly published messages.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          poll = only new posts (the cron) · backfill = walk back DAYS days ·
          republish = promote queued Telegram jobs to published · dryrun =
          run the full pipeline and print decisions, write nothing
        type: choice
        options: [poll, backfill, republish, dryrun]
        default: backfill
      days:
        description: "Backfill: how many days of history to cover"
        default: "30"
      pages:
        description: "Backfill: page ceiling per channel (~20 posts/page — a safety cap, DAYS is what actually bounds it)"
        default: "60"

# If a run is still going when the next cron fires, let the first finish
# rather than racing it for the same cursor.
concurrency:
  group: poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # A poll tick finishes in well under a minute; a 30-day backfill across
    # all channels, each post going through triage first, can run long.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --omit=dev

      - name: Run poller
        env:
          FEED_CHANNELS: cd4cd,sharqiahjobs,wadhefadotcom,ewdifh,lab_jobs1,jobsjeddah24,medicalghallab,tvt1440,MOHNADJOB,aseerjobs24,jazanjobs
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://raeeldlirslrjqxjjhaq.supabase.co' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ inputs.mode || 'poll' }}
          DAYS: ${{ inputs.days || '30' }}
          PAGES: ${{ inputs.pages || '60' }}
          JOB_STATUS: published
        run: node run.js
